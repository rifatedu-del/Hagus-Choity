<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>হাগুস চৈতি – টয়লেট অভিযান</title>
<style>
:root{--bg:#10151c;--fg:#f4f1e8;--accent:#ffcc00;--bad:#e5484d;--ok:#3ecf6e;color-scheme:dark}
@media (prefers-color-scheme: dark){:root{--bg:#10151c;--fg:#f4f1e8}}
:root[data-theme="dark"]{--bg:#10151c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Noto Sans Bengali','Kalpurush','SolaimanLipi',system-ui,sans-serif;overflow:hidden;touch-action:none}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#hud{padding:6px 10px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:14px}
.bar{height:14px;background:#2a3340;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:8px}
#pee i{background:linear-gradient(90deg,#f5d300,#e5484d)}
#sta i{background:#3aa0ff}
#wrap{flex:1;position:relative;min-height:0}
canvas{width:100%;height:100%;display:block}
#ctl{height:210px;display:flex;justify-content:space-between;align-items:center;padding:0 18px 8px}
#pad{width:190px;height:190px;border-radius:50%;background:#1d2530;border:3px solid #34404f;position:relative;touch-action:none}
#pad span{position:absolute;font-size:34px;color:#8fa0b5;display:flex;align-items:center;justify-content:center;width:60px;height:60px}
#knob{position:absolute;width:70px;height:70px;border-radius:50%;background:#ffcc0099;left:60px;top:60px;pointer-events:none}
#run{width:130px;height:130px;border-radius:50%;background:#e5484d;border:4px solid #ff8a8d;color:#fff;font-size:22px;font-weight:700;touch-action:none;font-family:inherit}
#run.on{background:#ff7a7d;transform:scale(.95)}
.ov{position:absolute;inset:0;background:#0a0e14ee;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
.ov h1{margin:0;font-size:38px;color:var(--accent)}
.ov p{margin:0;font-size:17px;line-height:1.5;max-width:340px}
.ov button{font-family:inherit;font-size:24px;font-weight:700;padding:14px 34px;border:0;border-radius:16px;background:var(--accent);color:#222;margin-top:8px}
.hide{display:none}
</style>
</head>
<body>
<div id="app">
 <div id="hud">
  <div id="sc">স্কোর: ০</div><div id="pee" class="bar"><i></i></div>
  <div style="font-size:12px;opacity:.8">টয়লেট চাপ</div><div id="sta" class="bar"><i></i></div>
 </div>
 <div id="wrap">
  <canvas id="cv"></canvas>
  <div id="start" class="ov">
   <h1>হাগুস চৈতি</h1>
   <p>তৃতীয় বিজ্ঞান ভবন ও কেএফসি এলাকায় টয়লেট খুঁজে বের করো! চাপ ১০০% হওয়ার আগে পৌঁছাও, আর রিয়াজ বসের হাত থেকে বাঁচো।</p>
   <button id="go">খেলা শুরু</button>
  </div>
  <div id="over" class="ov hide">
   <h1>খেলা শেষ!</h1>
   <p id="why"></p><p id="fin"></p>
   <button id="again">আবার খেলো</button>
  </div>
 </div>
 <div id="ctl">
  <div id="pad"><span style="left:65px;top:2px">▲</span><span style="left:65px;bottom:2px">▼</span><span style="left:2px;top:65px">◀</span><span style="right:2px;top:65px">▶</span><div id="knob"></div></div>
  <button id="run">দৌড়</button>
 </div>
</div>
<script>
const W=1000,H=1500,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const bn=n=>String(Math.round(n)).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const FONT="'Noto Sans Bengali','Kalpurush',sans-serif";
const solids=[{x:150,y:80,w:700,h:330,t:'sci'},{x:300,y:650,w:400,h:200,t:'kfc'}];
[[200,480],[700,480]].forEach(p=>solids.push({x:p[0],y:p[1],w:80,h:22,t:'bench'}));
[[60,60],[930,60],[80,600],[900,640],[120,900],[860,900],[250,1100],[750,1100],[90,1300],[900,1350],[500,1420],[60,450],[940,450],[600,1000],[380,1250]]
 .forEach(p=>solids.push({x:p[0]-14,y:p[1]-14,w:28,h:28,t:'tree'}));
[[300,1180],[650,930]].forEach(p=>solids.push({x:p[0],y:p[1],w:80,h:22,t:'bench'}));
const toilets=[{x:90,y:300,n:'পশ্চিম টয়লেট'},{x:910,y:300,n:'পূর্ব টয়লেট'},{x:160,y:1000,n:'টয়লেট'},{x:840,y:1000,n:'টয়লেট'},{x:500,y:1300,n:'টয়লেট'}];
let S,keys={dx:0,dy:0,run:false},best=0;
try{best=+localStorage.getItem('hc_best')||0}catch(e){}
function hit(x,y,r){if(x-r<0||y-r<0||x+r>W||y+r>H)return true;
 for(const s of solids)if(x+r>s.x&&x-r<s.x+s.w&&y+r>s.y&&y-r<s.y+s.h)return true;return false}
function mv(e,dx,dy,r){if(!hit(e.x+dx,e.y,r))e.x+=dx;if(!hit(e.x,e.y+dy,r))e.y+=dy}
function newEnemy(){let x,y,t=0;do{x=60+Math.random()*(W-120);y=60+Math.random()*(H-120);t++}while((hit(x,y,20)||Math.hypot(x-S.p.x,y-S.p.y)<400)&&t<60);
 return{x,y,wx:x,wy:y}}
function pickToilet(){let t;do{t=toilets[Math.random()*toilets.length|0]}while(t===S.t&&toilets.length>1);S.t=t}
function reset(){S={p:{x:500,y:540},pee:0,sta:100,score:0,en:[],over:false,time:0,flash:0,face:1};
 S.en.push(newEnemy());pickToilet()}
function begin(){reset();show('start',0);show('over',0);S.run=true}
function show(id,v){document.getElementById(id).classList.toggle('hide',!v)}
function end(why){S.over=true;S.run=false;if(S.score>best){best=S.score;try{localStorage.setItem('hc_best',best)}catch(e){}}
 document.getElementById('why').textContent=why;
 document.getElementById('fin').textContent='তোমার স্কোর: '+bn(S.score)+'  |  সেরা: '+bn(best);show('over',1)}
function update(dt){
 if(!S||!S.run)return;S.time+=dt;
 const p=S.p;let dx=keys.dx,dy=keys.dy,m=Math.hypot(dx,dy);
 const moving=m>.1;let run=keys.run&&S.sta>0&&moving;
 if(run)S.sta=Math.max(0,S.sta-35*dt);else S.sta=Math.min(100,S.sta+22*dt);
 if(moving){const sp=(run?290:200)*dt;if(dx<0)S.face=-1;if(dx>0)S.face=1;mv(p,dx/Math.max(m,1)*sp*Math.min(m,1),dy/Math.max(m,1)*sp*Math.min(m,1),14)}
 S.pee+=Math.min(2.4,1.6+S.score*.05)*dt;
 const want=Math.min(1+Math.floor(S.score/3),4);while(S.en.length<want)S.en.push(newEnemy());
 for(const e of S.en){const d=Math.hypot(p.x-e.x,p.y-e.y);let tx,ty,sp;
  if(d<230){tx=p.x;ty=p.y;sp=78+S.score*1.5}else{if(Math.hypot(e.wx-e.x,e.wy-e.y)<20||Math.random()<.003){e.wx=60+Math.random()*(W-120);e.wy=60+Math.random()*(H-120)}tx=e.wx;ty=e.wy;sp=55}
  const a=Math.atan2(ty-e.y,tx-e.x);mv(e,Math.cos(a)*sp*dt,Math.sin(a)*sp*dt,16);
  if(d<32){end('রিয়াজ বস ধরে ফেলেছে!');return}}
 const t=S.t;if(Math.hypot(p.x-t.x,p.y-t.y)<40){S.score++;S.pee=0;S.flash=1;S.sta=100;pickToilet()}
 S.flash=Math.max(0,S.flash-dt);
 if(S.pee>=100){S.pee=100;end('টয়লেট চাপ ১০০% হয়ে গেছে!')}
}
function head(x,y,r,k){ctx.save();ctx.translate(x,y);
 if(k==='p'){ctx.fillStyle='#3b2418';ctx.beginPath();ctx.arc(0,-2,r+3,0,7);ctx.fill();ctx.fillStyle='#e8b48a';ctx.beginPath();ctx.arc(0,2,r,0,7);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-r*.35,0,2.5,0,7);ctx.arc(r*.35,0,2.5,0,7);ctx.fill();ctx.beginPath();ctx.arc(0,-r*.5,1.8,0,7);ctx.fill();
  ctx.strokeStyle='#b3262e';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,r*.35,r*.3,.1,3.04);ctx.stroke()}
 else{ctx.fillStyle='#d9a173';ctx.beginPath();ctx.arc(0,2,r,0,7);ctx.fill();ctx.fillStyle='#1a1410';ctx.beginPath();ctx.arc(0,-r*.55,r*.85,Math.PI,0);ctx.fill();
  ctx.fillRect(-r*.8,-r*.2,r*.7,r*.35);ctx.fillRect(r*.1,-r*.2,r*.7,r*.35);ctx.fillRect(-r*.1,-r*.12,r*.2,3);
  ctx.strokeStyle='#2b1d12';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,r*.45,r*.3,.2,2.9);ctx.stroke()}
 ctx.restore()}
function label(t,x,y,c){ctx.font='bold 13px '+FONT;ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText(t,x,y);ctx.fillStyle=c;ctx.fillText(t,x,y)}
function draw(){
 const dpr=Math.min(devicePixelRatio||1,2),cw=cv.clientWidth,ch=cv.clientHeight;
 if(cv.width!==cw*dpr||cv.height!==ch*dpr){cv.width=cw*dpr;cv.height=ch*dpr}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cw,ch);
 if(!S)return;
 const sc=cw/520,vw=cw/sc,vh=ch/sc,p=S.p;
 const cx=Math.max(0,Math.min(W-vw,p.x-vw/2)),cy=Math.max(0,Math.min(H-vh,p.y-vh/2));
 ctx.save();ctx.scale(sc,sc);ctx.translate(-cx,-cy);
 ctx.fillStyle='#4e9a43';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#b9b3a3';ctx.fillRect(430,410,140,1090);ctx.fillRect(0,420,W,100);ctx.fillRect(260,860,480,80);ctx.fillRect(0,1190,W,80);ctx.fillRect(280,520,30,330);ctx.fillRect(690,520,30,330);
 ctx.fillStyle='#d6d0c0';ctx.fillRect(300,830,400,30);
 for(const s of solids){
  if(s.t==='sci'){ctx.fillStyle='#8c3b2f';ctx.fillRect(s.x,s.y,s.w,s.h);ctx.fillStyle='#d9c9a6';for(let i=0;i<8;i++)for(let j=0;j<3;j++)ctx.fillRect(s.x+30+i*84,s.y+30+j*90,44,50);
   ctx.fillStyle='#3a2220';ctx.fillRect(s.x+s.w/2-40,s.y+s.h-70,80,70);label('তৃতীয় বিজ্ঞান ভবন',s.x+s.w/2,s.y-8,'#fff')}
  else if(s.t==='kfc'){ctx.fillStyle='#d5202b';ctx.fillRect(s.x,s.y,s.w,s.h);ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y+s.h-50,s.w,14);ctx.font='bold 40px '+FONT;ctx.textAlign='center';ctx.fillText('KFC',s.x+s.w/2,s.y+80);label('কেএফসি',s.x+s.w/2,s.y-8,'#fff')}
  else if(s.t==='bench'){ctx.fillStyle='#7a4f2a';ctx.fillRect(s.x,s.y,s.w,s.h);ctx.fillStyle='#4b2f18';ctx.fillRect(s.x,s.y+s.h-4,s.w,4)}
  else{ctx.fillStyle='#5b3a1c';ctx.fillRect(s.x+10,s.y+10,8,16);ctx.fillStyle='#2c7a2c';ctx.beginPath();ctx.arc(s.x+14,s.y+8,24,0,7);ctx.fill();ctx.fillStyle='#37913a';ctx.beginPath();ctx.arc(s.x+8,s.y+2,14,0,7);ctx.fill()}}
 for(const t of toilets){const act=t===S.t;ctx.font='34px sans-serif';ctx.textAlign='center';
  if(act){ctx.fillStyle='rgba(255,204,0,'+(.35+.25*Math.sin(S.time*6))+')';ctx.beginPath();ctx.arc(t.x,t.y,44,0,7);ctx.fill()}
  ctx.globalAlpha=act?1:.45;ctx.fillText('🚽',t.x,t.y+12);ctx.globalAlpha=1;if(act)label(t.n,t.x,t.y-32,'#ffe066')}
 for(const e of S.en){ctx.fillStyle='#7a1f1f';ctx.fillRect(e.x-14,e.y+8,28,22);head(e.x,e.y-4,18,'e');label('রিয়াজ বস',e.x,e.y-28,'#ff9a9a')}
 ctx.fillStyle='#f2c200';ctx.fillRect(p.x-11,p.y+10,22,20);head(p.x,p.y-4,15,'p');label('হাগুস চৈতি',p.x,p.y-26,'#ffe066');
 if(S.pee>70){ctx.font='20px sans-serif';ctx.fillText('😖',p.x+22,p.y-20)}
 ctx.restore();
 const t=S.t,tx=(t.x-cx)*sc,ty=(t.y-cy)*sc;
 if(tx<20||tx>cw-20||ty<20||ty>ch-20){const a=Math.atan2(t.y-p.y,t.x-p.x),ax=Math.max(30,Math.min(cw-30,tx)),ay=Math.max(30,Math.min(ch-30,ty));
  ctx.save();ctx.translate(ax,ay);ctx.rotate(a);ctx.fillStyle='#ffcc00';ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-12,-14);ctx.lineTo(-12,14);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
 ctx.font='bold 15px '+FONT;ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#000';
 const dm='টয়লেট: '+bn(Math.hypot(t.x-p.x,t.y-p.y)/10)+' মিটার';ctx.strokeText(dm,cw/2,ch-10);ctx.fillStyle='#fff';ctx.fillText(dm,cw/2,ch-10);
 if(S.flash>0){ctx.fillStyle='rgba(62,207,110,'+S.flash*.35+')';ctx.fillRect(0,0,cw,ch);label('বাঁচলাম! +১',cw/2,ch/2,'#9dffb8')}
 document.getElementById('sc').textContent='স্কোর: '+bn(S.score)+'  সেরা: '+bn(best);
 const pi=document.querySelector('#pee i');pi.style.width=S.pee+'%';document.querySelector('#sta i').style.width=S.sta+'%';
}
let last=0;function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}
const pad=document.getElementById('pad'),knob=document.getElementById('knob');
function padSet(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let x=(e.clientX-cx)/(r.width/2),y=(e.clientY-cy)/(r.height/2),m=Math.hypot(x,y);if(m>1){x/=m;y/=m;m=1}
 if(m<.18){keys.dx=0;keys.dy=0}else{keys.dx=x;keys.dy=y}
 knob.style.left=(60+x*50)+'px';knob.style.top=(60+y*50)+'px'}
function padEnd(){keys.dx=0;keys.dy=0;knob.style.left='60px';knob.style.top='60px'}
pad.addEventListener('pointerdown',e=>{e.preventDefault();pad.setPointerCapture(e.pointerId);padSet(e)});
pad.addEventListener('pointermove',e=>{if(e.buttons||e.pressure>0)padSet(e)});
pad.addEventListener('pointerup',padEnd);pad.addEventListener('pointercancel',padEnd);
const run=document.getElementById('run');
run.addEventListener('pointerdown',e=>{e.preventDefault();run.setPointerCapture(e.pointerId);keys.run=true;run.classList.add('on')});
['pointerup','pointercancel'].forEach(n=>run.addEventListener(n,()=>{keys.run=false;run.classList.remove('on')}));
const kb={};addEventListener('keydown',e=>{kb[e.key]=1;kk()});addEventListener('keyup',e=>{kb[e.key]=0;kk()});
function kk(){const x=(kb.ArrowRight||kb.d?1:0)-(kb.ArrowLeft||kb.a?1:0),y=(kb.ArrowDown||kb.s?1:0)-(kb.ArrowUp||kb.w?1:0);if(x||y||!keys.dx&&!keys.dy){keys.dx=x;keys.dy=y}keys.run=!!kb.Shift||keys.run&&!!run.classList.contains('on')}
document.getElementById('go').onclick=begin;document.getElementById('again').onclick=begin;
document.addEventListener('contextmenu',e=>e.preventDefault());
reset();S.run=false;requestAnimationFrame(loop);
</script>
</body>
</html>
